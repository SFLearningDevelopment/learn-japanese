<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Introduction with Audio Pronunciation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .voice-picker { background: #eef0ff; padding: 16px 30px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #dfe3ff; }
        .voice-picker label { font-weight: 600; color: #4a4a6a; }
        .voice-picker select { padding: 8px 12px; border-radius: 8px; border: 1px solid #c3c8f0; font-size: 0.95em; flex: 1; min-width: 200px; }
        .content { padding: 30px; }
        .introduction-card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-left: 5px solid #667eea; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .introduction-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .introduction-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2, #4ecdc4); }
        .japanese-text { font-size: 2em; font-weight: bold; color: #2c3e50; margin-bottom: 10px; font-family: 'Hiragino Kaku Gothic Pro', 'Yu Gothic', sans-serif; }
        .romanji { font-size: 1.3em; color: #7f8c8d; font-style: italic; margin-bottom: 8px; }
        .english { font-size: 1.2em; color: #667eea; font-weight: 600; margin-bottom: 15px; }
        .audio-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .play-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-size: 1em; font-weight: 600; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .play-btn:hover { background: linear-gradient(135deg, #764ba2, #667eea); transform: scale(1.05); }
        .play-btn:active { transform: scale(0.95); }
        .control-group { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .volume-control, .speed-control { display: flex; align-items: center; gap: 8px; }
        .speed-label { font-size: 0.9em; font-weight: 700; color: #e63946; min-width: 40px; text-align: center; }
        .volume-slider { width: 80px; height: 5px; border-radius: 5px; background: #ddd; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #4ecdc4; cursor: pointer; }
        .speed-slider { width: 120px; height: 8px; border-radius: 5px; background: #ffd6d6; outline: none; cursor: pointer; }
        .speed-slider::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #e63946; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 4px rgba(230,57,70,0.6); }
        .speed-slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #e63946; cursor: pointer; border: 2px solid #fff; }
        .status { font-size: 0.9em; color: #7f8c8d; margin-left: auto; font-style: italic; }
        .footer { text-align: center; padding: 20px; background: #f8f9fa; color: #666; font-size: 0.9em; }
        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .japanese-text { font-size: 1.5em; }
            .audio-controls { flex-direction: column; align-items: stretch; }
            .control-group { justify-content: center; }
            .volume-control, .speed-control { margin-left: 0; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
